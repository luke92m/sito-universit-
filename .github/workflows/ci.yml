name: CI

on:
  push:
    branches: [main, migrazione-nextjs]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Build per Cloudflare Workers (vinext): è quella che va in produzione.
      - run: npm run build:vinext

  # Percorso pubblico nel browser (finder, comparatore, borse, metodo) sull'anteprima locale del Worker Cloudflare.
  # I test con account (auth.spec.ts) restano locali: servono Supabase e un utente di test.
  e2e:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
      E2E_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Si prova il Worker vinext, cioè quello che va online, non la build Next.
      - run: npm run build:vinext
      - name: Avvio dell'anteprima del Worker
        run: |
          npm run start:vinext &
          for i in $(seq 1 90); do curl -sf http://localhost:4173 > /dev/null && exit 0; sleep 1; done
          exit 1
      # Un test alla volta: in parallelo l'anteprima del Worker manda alcuni test in timeout.
      - run: npx playwright test tests/e2e/public.spec.ts --workers=1
